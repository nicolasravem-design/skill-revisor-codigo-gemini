# Publica la carpeta landing-page/ en GitHub Pages cada vez que se hace push a main
name: Publicar landing page

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta de la landing
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
